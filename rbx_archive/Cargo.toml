[package]
name = "rbx_archive"
version = "0.1.0"
description = "Roblox archive place file reader and writer"
edition = "2021"
license = "MIT"
repository = "https://github.com/rojo-rbx/rbx-dom"
readme = "README.md"

[dependencies]
rbx_binary = { version = "3.0.1", path = "../rbx_binary" }
rbx_dom_weak = { version = "4.2.0", path = "../rbx_dom_weak" }
blake3 = "1.3.1"
serde = { version = "1.0.137", features = ["derive"] }
serde_json = { version = "1.0.81", features = ["raw_value"] }
thiserror = "1.0.31"
# ZipIterable exposes every physical member, including duplicate names.
# The crate requires an exact version for this experimental API.
zip = { version = "=9.3.0", default-features = false }

[dev-dependencies]
rbx_xml = { version = "3.0.1", path = "../rbx_xml" }
